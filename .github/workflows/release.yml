name: Release production
run-name: Release ${{ github.sha }} to donhang.9chum.vn

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: donhang-9chum-production
  cancel-in-progress: false

env:
  APP_IMAGE: ghcr.io/djoker96/9chum_order:app-${{ github.sha }}
  OPS_IMAGE: ghcr.io/djoker96/9chum_order:ops-${{ github.sha }}

jobs:
  ci:
    name: Required CI gates
    uses: ./.github/workflows/ci.yml

  release:
    name: Build, publish, and deploy
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://donhang.9chum.vn

    steps:
      - name: Validate release revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Production releases must run from the main branch." >&2
            exit 1
          fi
          if [[ ! "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The release revision must be a full lowercase Git commit SHA." >&2
            exit 1
          fi

      - name: Check out release revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable image tag state
        id: registry
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          token_response="$(curl --fail --silent --show-error --retry 3 \
            --user "${GITHUB_ACTOR}:${GHCR_TOKEN}" \
            --get \
            --data-urlencode 'service=ghcr.io' \
            --data-urlencode 'scope=repository:djoker96/9chum_order:pull' \
            'https://ghcr.io/token')"
          registry_token="$(jq -er '.token // .access_token' <<< "${token_response}")"
          echo "::add-mask::${registry_token}"

          for kind in app ops; do
            if [[ "${kind}" == app ]]; then image="${APP_IMAGE}"; else image="${OPS_IMAGE}"; fi
            tag="${image##*:}"
            status="$(curl --silent --show-error --location --retry 3 \
              --output /dev/null \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${registry_token}" \
              --header 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
              "https://ghcr.io/v2/djoker96/9chum_order/manifests/${tag}")"

            case "${status}" in
              404)
                echo "${kind}_exists=false" >> "${GITHUB_OUTPUT}"
                ;;
              200)
                echo "${kind}_exists=true" >> "${GITHUB_OUTPUT}"
                ;;
              *)
                echo "Could not prove that ${image} is absent (registry returned HTTP ${status})." >&2
                exit 1
                ;;
            esac
          done

      - name: Pull existing immutable app image for a safe retry
        if: steps.registry.outputs.app_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${APP_IMAGE}"

      - name: Pull existing immutable ops image for a safe retry
        if: steps.registry.outputs.ops_exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${OPS_IMAGE}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build app image
        if: steps.registry.outputs.app_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: app
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.APP_IMAGE }}
          build-args: |
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build ops image
        if: steps.registry.outputs.ops_exists != 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          target: ops
          platforms: linux/amd64
          pull: true
          load: true
          tags: ${{ env.OPS_IMAGE }}
          build-args: |
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Verify local image revision labels
        shell: bash
        run: |
          set -euo pipefail
          for image in "${APP_IMAGE}" "${OPS_IMAGE}"; do
            revision="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "${image}")"
            if [[ "${revision}" != "${GITHUB_SHA}" ]]; then
              echo "Image ${image} has revision ${revision}, expected ${GITHUB_SHA}." >&2
              exit 1
            fi
            source_repository="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.source" }}' \
              "${image}")"
            if [[ "${source_repository}" != "https://github.com/${GITHUB_REPOSITORY}" ]]; then
              echo "Image ${image} has an unexpected source label." >&2
              exit 1
            fi
          done

      - name: Scan app image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.APP_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Scan ops image before publishing
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.OPS_IMAGE }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL
          scanners: vuln

      - name: Push immutable app image
        if: steps.registry.outputs.app_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${APP_IMAGE}"

      - name: Push immutable ops image
        if: steps.registry.outputs.ops_exists != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker push "${OPS_IMAGE}"

      - name: Prove images are anonymously pullable before touching production
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          docker image rm "${APP_IMAGE}" "${OPS_IMAGE}" >/dev/null
          docker pull "${APP_IMAGE}"
          docker pull "${OPS_IMAGE}"

          for image in "${APP_IMAGE}" "${OPS_IMAGE}"; do
            revision="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "${image}")"
            test "${revision}" = "${GITHUB_SHA}"
          done

      - name: Deploy through restricted SSH gateway
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          if [[ -z "${SSH_PRIVATE_KEY}" || -z "${SSH_KNOWN_HOSTS}" ]]; then
            echo "Deployment SSH secrets are not configured." >&2
            exit 1
          fi

          ssh_dir="${RUNNER_TEMP}/donhang-9chum-ssh"
          key_file="${ssh_dir}/deploy-key"
          known_hosts_file="${ssh_dir}/known_hosts"
          install -d -m 700 "${ssh_dir}"
          umask 077
          printf '%s\n' "${SSH_PRIVATE_KEY}" > "${key_file}"
          printf '%s\n' "${SSH_KNOWN_HOSTS}" > "${known_hosts_file}"
          chmod 600 "${key_file}" "${known_hosts_file}"

          cleanup() {
            rm -f -- "${key_file}" "${known_hosts_file}"
            rmdir "${ssh_dir}" 2>/dev/null || true
          }
          trap cleanup EXIT

          ssh-keygen -y -f "${key_file}" >/dev/null
          ssh-keygen -l -f "${known_hosts_file}" >/dev/null

          ssh -T \
            -i "${key_file}" \
            -p 22 \
            -o BatchMode=yes \
            -o ClearAllForwardings=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o KbdInteractiveAuthentication=no \
            -o PasswordAuthentication=no \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=${known_hosts_file}" \
            donhang-deploy@223.130.11.193 \
            "deploy ${GITHUB_SHA}"
